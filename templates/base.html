<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title Conversor de unidades</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #1f2328; margin: 0; padding: 32px 16px; }
    main { max-width: 420px; margin: 0 auto; background: #fff; border: 2px solid #1f2328; border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 16px; font-size: 1.6rem; }
    nav { display: flex; gap: 20px; margin-bottom: 24px; }
    nav a { color: #1f2328; text-decoration: none; padding-bottom: 4px; }
    nav a.active { color: #4a6cf7; border-bottom: 3px solid #4a6cf7; }
    label { display: block; margin: 16px 0 6px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; border: 2px solid #1f2328; border-radius: 6px; }
    .button { display: inline-block; margin-top: 20px; padding: 10px 28px; font-size: 1rem; background: #fff; color: #1f2328; border: 2px solid #1f2328; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .result { font-size: 1.6rem; font-weight: bold; }
    .error { color: #b42318; background: #fef3f2; padding: 8px 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Conversor de unidades</h1>
    <nav>$tabs</nav>
    $content
  </main>
</body>
</html>
